<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Verify your email</title>
    <style>
      body { font-family: Arial, sans-serif; background:#f6f7fb; padding:24px; }
      .card { background:#fff; border-radius:12px; padding:24px; max-width:560px; margin:auto; box-shadow:0 6px 20px rgba(0,0,0,0.06); }
      .btn { display:inline-block; padding:12px 20px; border-radius:8px; text-decoration:none; background:#111827; color:#fff; }
      .muted { color:#6b7280; font-size:12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Verify your email</h2>
      <p>Click the button below to verify your email address.</p>
      <p>
        <a class="btn" href="{{ verify_link }}" target="_blank">Verify Email</a>
      </p>
      <p class="muted">If you didn’t create an account, please ignore this email.</p>
    </div>
  </body>
</html>
