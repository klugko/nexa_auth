<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reset your password</title>
    <style>
      body { font-family: Arial, sans-serif; background:#f6f7fb; padding:24px; }
      .card { background:#fff; border-radius:12px; padding:24px; max-width:560px; margin:auto; box-shadow:0 6px 20px rgba(0,0,0,0.06); }
      .btn { display:inline-block; padding:12px 20px; border-radius:8px; text-decoration:none; background:#111827; color:#fff; }
      .muted { color:#6b7280; font-size:12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Reset your password</h2>
      <p>We received a request to reset your password.</p>
      <p>
        Click the button below to set a new password. This link expires in {{ expires_minutes }} minutes.
      </p>
      <p>
        <a class="btn" href="{{ reset_link }}" target="_blank">Reset Password</a>
      </p>
      <p class="muted">
        If you didn’t request this, you can safely ignore this email.
      </p>
    </div>
  </body>
</html>
